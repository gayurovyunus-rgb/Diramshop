<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Diramshop</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f2f2f7;
  padding-bottom:80px;
}

.app{
  max-width:600px;
  margin:auto;
  padding:20px;
}

.logo{
  text-align:center;
  font-size:30px;
  font-weight:bold;
  margin-bottom:20px;
}

.card{
  background:white;
  padding:20px;
  margin:15px 0;
  border-radius:20px;
}

button,input{
  width:100%;
  padding:15px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  font-size:16px;
}

button{
  background:#111;
  color:white;
}

input{
  background:#eee;
}

.green{
  background:#16a34a;
}

.red{
  background:#dc2626;
}

.hidden{
  display:none;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  padding:10px;
  display:flex;
  gap:10px;
}

.bottom button{
  margin:0;
}

.price{
  color:#16a34a;
  font-weight:bold;
  margin-top:5px;
}
</style>

</head>

<body>

<div class="app">

<div class="logo">
🛒 Diramshop
</div>


<!-- HOME -->

<div id="home">

<div class="card">

<h2>Хуш омадед 👋</h2>

<p>Ба Diramshop хуш омадед!</p>

</div>


<div class="card">

<h3>Шакар 1 кг</h3>

<div class="price">
9.80 сомонӣ
</div>

<button class="green" onclick="addCart('Шакар 1 кг',9.80)">
🛒 Ба сабад
</button>

</div>


<div class="card">

<h3>Колбаса</h3>

<div class="price">
36.80 сомонӣ
</div>

<button class="green" onclick="addCart('Колбаса',36.80)">
🛒 Ба сабад
</button>

</div>

</div>


<!-- CART -->

<div id="cartPage" class="hidden">

<div class="card">

<h2>🛒 Сабад</h2>

<div id="cartItems">
Сабад холӣ аст
</div>

<button onclick="showHome()">
← Бозгашт
</button>

</div>

</div>


<!-- ADMIN LOGIN -->

<div id="loginPage" class="hidden">

<div class="card">

<h2>👨‍💼 Admin</h2>

<input
id="password"
type="password"
placeholder="Парол"
>

<button onclick="login()">
Даромадан
</button>

<button onclick="showHome()">
← Бозгашт
</button>

</div>

</div>


<!-- ADMIN PANEL -->

<div id="adminPage" class="hidden">

<div class="card">

<h2>
👨‍💼 Панели Admin
</h2>

<p>
Admin бомуваффақият кушода шуд!
</p>

<button class="red" onclick="logout()">
Баромадан
</button>

</div>

</div>

</div>


<!-- MENU -->

<div class="bottom">

<button onclick="showHome()">
🏠 Асосӣ
</button>

<button onclick="showCart()">
🛒 Сабад
</button>

<button onclick="showAdmin()">
👨‍💼 Admin
</button>

</div>


<script>

let cart=[];


function hideAll(){

document.getElementById("home").classList.add("hidden");

document.getElementById("cartPage").classList.add("hidden");

document.getElementById("loginPage").classList.add("hidden");

document.getElementById("adminPage").classList.add("hidden");

}


function showHome(){

hideAll();

document.getElementById("home").classList.remove("hidden");

}


function showCart(){

hideAll();

document.getElementById("cartPage").classList.remove("hidden");

let html="";

cart.forEach(function(item){

html += "<p><b>"+item.name+"</b> - "+item.price+" сомонӣ</p>";

});

if(html==""){

html="Сабад холӣ аст 🛒";

}

document.getElementById("cartItems").innerHTML=html;

}


function showAdmin(){

hideAll();

document.getElementById("loginPage").classList.remove("hidden");

}


function login(){

let pass=document.getElementById("password").value;

if(pass=="1234"){

hideAll();

document.getElementById("adminPage").classList.remove("hidden");

alert("Хуш омадед Admin 👨‍💼");

}else{

alert("Парол нодуруст ❌");

}

}


function logout(){

showHome();

}


function addCart(name,price){

cart.push({

name:name,

price:price

});

alert("Ба сабад илова шуд 🛒");

}

</script>

</body>
</html>
