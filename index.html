<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diramshop</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f2f7;
  color:#111;
}
.app{
  max-width:600px;
  margin:auto;
  min-height:100vh;
  padding:20px;
}
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo{
  font-size:28px;
  font-weight:bold;
}
.card{
  background:white;
  border-radius:22px;
  padding:18px;
  margin:15px 0;
  box-shadow:0 5px 20px #00000012;
}
input,button{
  width:100%;
  padding:15px;
  margin-top:10px;
  border-radius:14px;
  border:none;
  font-size:16px;
}
input{background:#f2f2f7}
button{
  background:#111;
  color:white;
  font-weight:bold;
}
.product{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.price{
  color:#16a34a;
  font-weight:bold;
}
.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  display:flex;
  justify-content:space-around;
  padding:15px;
  box-shadow:0 -2px 15px #00000015;
}
.bottom button{
  width:auto;
  margin:0;
  background:none;
  color:#111;
  padding:5px;
}
.hidden{display:none}
.message{
  padding:12px;
  background:#e5e5ea;
  border-radius:15px;
  margin:8px 0;
}
.adminmsg{
  background:#007aff;
  color:white;
}
</style>
</head>

<body>

<div class="app">

<div id="register">
  <div class="card">
    <h1>🛍️ Diramshop</h1>
    <p>Хуш омадед! Барои оғоз аккаунт кушоед.</p>

    <input id="firstname" placeholder="Ном">
    <input id="lastname" placeholder="Фамилия">
    <input id="phone" placeholder="Рақами телефон">

    <button onclick="registerUser()">Кушодани аккаунт</button>
  </div>
</div>

<div id="shop" class="hidden">

<div class="header">
  <div class="logo">🛍️ Diramshop</div>
  <div>🛒 <span id="cartCount">0</span></div>
</div>

<div id="homePage">
  <div class="card">
    <h2>Салом, <span id="username"></span> 👋</h2>
    <p>Маҳсулотҳои моро интихоб кунед</p>
  </div>

  <div class="card product">
    <div>
      <h3>🛒 Маҳсулот</h3>
      <p>Маҳсулоти нав ба наздикӣ илова мешавад</p>
    </div>
    <button onclick="addProduct()" style="width:auto">+</button>
  </div>
</div>

<div id="cartPage" class="hidden">
  <div class="card">
    <h2>🛒 Сабади ман</h2>
    <div id="cartItems">Сабад холӣ аст</div>
    <button onclick="order()">📦 Омода кардани фармоиш</button>
  </div>
</div>

<div id="chatPage" class="hidden">
  <div class="card">
    <h2>💬 Чат бо Админ</h2>

    <div id="messages">
      <div class="message adminmsg">
        Салом! 👋 Ман Админ ҳастам. Чӣ кӯмак кунам?
      </div>
    </div>

    <input id="messageInput" placeholder="Паём нависед...">
    <button onclick="sendMessage()">Фиристодан</button>
  </div>
</div>

</div>
</div>

<div id="nav" class="bottom hidden">
  <button onclick="showPage('home')">🏠<br>Асосӣ</button>
  <button onclick="showPage('cart')">🛒<br>Сабад</button>
  <button onclick="showPage('chat')">💬<br>Чат</button>
</div>

<script>
let cart=[];

function registerUser(){
  let name=document.getElementById("firstname").value;
  let lastname=document.getElementById("lastname").value;
  let phone=document.getElementById("phone").value;

  if(!name || !lastname || !phone){
    alert("Ҳамаи маълумотро пур кунед!");
    return;
  }

  localStorage.setItem("userName",name);
  localStorage.setItem("userLast",lastname);
  localStorage.setItem("userPhone",phone);

  startApp();
}

function startApp(){
  document.getElementById("register").classList.add("hidden");
  document.getElementById("shop").classList.remove("hidden");
  document.getElementById("nav").classList.remove("hidden");

  document.getElementById("username").innerText=
    localStorage.getItem("userName") || "";
}

function addProduct(){
  cart.push({
    name:"Маҳсулоти интихобшуда",
    price:10
  });

  document.getElementById("cartCount").innerText=cart.length;
  alert("Ба сабад илова шуд! 🛒");
}

function showPage(page){
  document.getElementById("homePage").classList.add("hidden");
  document.getElementById("cartPage").classList.add("hidden");
  document.getElementById("chatPage").classList.add("hidden");

  if(page==="home"){
    document.getElementById("homePage").classList.remove("hidden");
  }

  if(page==="cart"){
    document.getElementById("cartPage").classList.remove("hidden");

    let html="";
    cart.forEach((item)=>{
      html+="<div class='card'>"+
      item.name+" - "+item.price+" сомонӣ</div>";
    });
    

    document.getElementById("cartItems").innerHTML=
      html || "Сабад холӣ аст";
  }

  if(page==="chat"){
    document.getElementById("chatPage").classList.remove("hidden");
  }
}

function sendMessage(){
  let input=document.getElementById("messageInput");
  let text=input.value;

  if(!text)return;

  document.getElementById("messages").innerHTML+=
  "<div class='message'>"+text+"</div>";

  input.value="";
}

function order(){
  if(cart.length===0){
    alert("Сабад холӣ аст!");
    return;
  }

  alert("Фармоиши шумо қабул шуд! 📦 Админ бо шумо тамос мегирад.");
  showPage("chat");
}

if(localStorage.getItem("userName")){
  startApp();
}
</script>

</body>
</html>
