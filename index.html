<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diramshop</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f2f2f7;padding-bottom:80px}
.app{max-width:600px;margin:auto;padding:15px}
.header{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:28px;font-weight:bold}
.card{background:white;padding:16px;border-radius:18px;margin:15px 0}
.product-img{width:100%;height:180px;object-fit:cover;border-radius:12px}
.price{color:green;font-weight:bold;font-size:18px}
input,button{width:100%;padding:14px;margin-top:10px;border:0;border-radius:12px;font-size:16px}
input{background:#eee}
button{background:#111;color:white}
.green{background:#16a34a}
.red{background:#dc2626}
.hidden{display:none}
.bottom{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;padding:8px;gap:5px}
.bottom button{margin:0;font-size:12px}
.message{background:#eee;padding:10px;border-radius:10px;margin:8px 0}
</style>
</head>

<body>

<div class="app">

<div class="header">
<div class="logo">🛒 Diramshop</div>
<div>🛒 <span id="cartCount">0</span></div>
</div>

<!-- HOME -->
<div id="homePage">

<div class="card">
<h2>Хуш омадед 👋</h2>
<p>Маҳсулоти лозимаатонро интихоб кунед</p>
</div>

<div id="products"></div>

</div>


<!-- CART -->
<div id="cartPage" class="hidden">

<div class="card">
<h2>🛒 Корзина</h2>
<div id="cartItems"></div>

<button class="green" onclick="order()">
📦 Фармоиш додан
</button>
</div>

</div>


<!-- CHAT -->
<div id="chatPage" class="hidden">

<div class="card">
<h2>💬 Чат бо Admin</h2>

<div id="messages"></div>

<input id="messageInput" placeholder="Паём навис...">

<button onclick="sendMessage()">
Фиристодан
</button>

</div>

</div>


<!-- LOGIN -->
<div id="loginPage" class="hidden">

<div class="card">

<h2>👨‍💼 Admin</h2>

<input
id="adminPassword"
type="password"
placeholder="Парол">

<button onclick="loginAdmin()">
Даромадан
</button>

</div>

</div>


<!-- ADMIN -->
<div id="adminPage" class="hidden">

<div class="card">

<h2>👨‍💼 Панели Admin</h2>

<input
id="productName"
placeholder="Номи маҳсулот">

<input
id="productPrice"
type="number"
placeholder="Нарх">

<input
id="productImage"
placeholder="Линки сурат">

<button
class="green"
onclick="addProduct()">
➕ Добавить маҳсулот
</button>

</div>

<div id="adminProducts"></div>

<button
class="red"
onclick="logoutAdmin()">
Баромадан
</button>

</div>

</div>


<!-- MENU -->
<div class="bottom">

<button onclick="showPage('home')">
🏠 Асосӣ
</button>

<button onclick="showPage('cart')">
🛒 Корзина
</button>

<button onclick="showPage('chat')">
💬 Чат
</button>

<button onclick="openAdmin()">
👨‍💼 Admin
</button>

</div>

<script>let products = JSON.parse(localStorage.getItem("products")) || [
  {
    id: 1,
    name: "Шакар 1 кг",
    price: "9.80",
    image: ""
  },
  {
    id: 2,
    name: "Колбаса",
    price: "36.80",
    image: ""
  }
];

let cart = JSON.parse(localStorage.getItem("cart")) || [];


function saveProducts(){
  localStorage.setItem("products", JSON.stringify(products));
}


function hideAll(){
  document.getElementById("homePage").classList.add("hidden");
  document.getElementById("cartPage").classList.add("hidden");
  document.getElementById("chatPage").classList.add("hidden");
  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("adminPage").classList.add("hidden");
}


function showPage(page){
  hideAll();

  if(page === "home"){
    document.getElementById("homePage").classList.remove("hidden");
    renderProducts();
  }

  if(page === "cart"){
    document.getElementById("cartPage").classList.remove("hidden");
    renderCart();
  }

  if(page === "chat"){
    document.getElementById("chatPage").classList.remove("hidden");
  }

  if(page === "login"){
    document.getElementById("loginPage").classList.remove("hidden");
  }

  if(page === "admin"){
    document.getElementById("adminPage").classList.remove("hidden");
    renderAdminProducts();
  }
}


function renderProducts(){
  let html = "";

  products.forEach(function(p){

    let image = "";

    if(p.image){
      image = '<img class="product-img" src="' + p.image + '">';
    }

    html += '<div class="card">' +
      image +
      '<h3>' + p.name + '</h3>' +
      '<div class="price">' + p.price + ' сомонӣ</div>' +
      '<button class="green" onclick="addToCart(' + p.id + ')">🛒 Ба корзина</button>' +
      '</div>';
  });

  document.getElementById("products").innerHTML =
    html || '<div class="card">Маҳсулот нест</div>';
}


function addToCart(id){
  let product = products.find(function(p){
    return p.id == id;
  });

  if(product){
    cart.push(product);

    localStorage.setItem("cart", JSON.stringify(cart));

    updateCartCount();

    alert("Ба корзина илова шуд! 🛒");
  }
}


function updateCartCount(){
  document.getElementById("cartCount").innerText = cart.length;
}


function renderCart(){
  let html = "";

  cart.forEach(function(p){
    html += '<div class="card"><b>' +
      p.name +
      '</b><br><span class="price">' +
      p.price +
      ' сомонӣ</span></div>';
  });

  document.getElementById("cartItems").innerHTML =
    html || '<p>Корзина холӣ аст 🛒</p>';
}


function sendMessage(){
  let input = document.getElementById("messageInput");
  let text = input.value.trim();

  if(!text) return;

  document.getElementById("messages").innerHTML +=
    '<div class="message">' + text + '</div>';

  input.value = "";
}


function openAdmin(){
  if(localStorage.getItem("adminLogged") === "true"){
    showPage("admin");
  }else{
    showPage("login");
  }
}


function loginAdmin(){
  let password = document.getElementById("adminPassword").value;

  if(password === "1234"){
    localStorage.setItem("adminLogged", "true");

    document.getElementById("adminPassword").value = "";

    showPage("admin");

    alert("Хуш омадед Admin 👨‍💼");
  }else{
    alert("Парол нодуруст ❌");
  }
}


function addProduct(){
  let name = document.getElementById("productName").value.trim();

  let price = document.getElementById("productPrice").value.trim();

  let image = document.getElementById("productImage").value.trim();

  if(!name || !price){
    alert("Ном ва нархро пур кунед!");
    return;
  }

  products.push({
    id: Date.now(),
    name: name,
    price: price,
    image: image
  });

  saveProducts();

  document.getElementById("productName").value = "";
  document.getElementById("productPrice").value = "";
  document.getElementById("productImage").value = "";

  renderProducts();
  renderAdminProducts();

  alert("Маҳсулот добавит шуд! ✅");
}


function renderAdminProducts(){
  let html = "";

  products.forEach(function(p){

    html += '<div class="card">' +
      '<b>' + p.name + '</b><br>' +
      '<span class="price">' + p.price + ' сомонӣ</span>' +
      '<button class="red" onclick="deleteProduct(' + p.id + ')">🗑️ Нест кардан</button>' +
      '</div>';

  });

  document.getElementById("adminProducts").innerHTML = html;
}


function deleteProduct(id){
  products = products.filter(function(p){
    return p.id != id;
  });

  saveProducts();

  renderProducts();
  renderAdminProducts();
}


function logoutAdmin(){
  localStorage.removeItem("adminLogged");

  showPage("home");
}


function order(){
  if(cart.length === 0){
    alert("Корзина холӣ аст!");
    return;
  }

  alert("Фармоиши шумо қабул шуд! 📦");
}


renderProducts();
updateCartCount();

</script>

</body>
</html>
