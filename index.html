<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diramshop</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f2f7;
  color:#111;
  padding-bottom:90px;
}

.app{
  max-width:600px;
  margin:auto;
  padding:20px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.logo{
  font-size:28px;
  font-weight:bold;
}

.card{
  background:white;
  border-radius:22px;
  padding:18px;
  margin:15px 0;
  box-shadow:0 5px 20px #00000012;
}

.product{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.product-info{
  flex:1;
}

.product-name{
  font-size:19px;
  font-weight:bold;
}

.price{
  color:#16a34a;
  font-weight:bold;
  margin-top:7px;
}

input,button{
  width:100%;
  padding:15px;
  margin-top:10px;
  border-radius:14px;
  border:none;
  font-size:16px;
}

input{
  background:#f2f2f7;
}

button{
  background:#111;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.green{
  background:#16a34a;
}

.red{
  background:#dc2626;
}

.hidden{
  display:none;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  display:flex;
  justify-content:space-around;
  padding:12px;
  box-shadow:0 -2px 15px #00000015;
  z-index:100;
}

.bottom button{
  width:auto;
  margin:0;
  background:none;
  color:#111;
  padding:8px 12px;
}

.admin-title{
  font-size:25px;
  font-weight:bold;
  margin-bottom:15px;
}

.small{
  color:#666;
  font-size:14px;
}

.product-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.product-actions button{
  margin:0;
}

.empty{
  text-align:center;
  color:#777;
  padding:30px 10px;
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div class="logo">Diramshop 🛒</div>
    <div>🛍️ <span id="cartCount">0</span></div>
  </div>


  <!-- HOME -->
  <div id="homePage">

    <div class="card">
      <h2>Хуш омадед! 👋</h2>
      <p>Маҳсулоти лозимаатонро интихоб кунед.</p>
    </div>

    <h2>Маҳсулот</h2>

    <div id="products"></div>

  </div>


  <!-- CART -->
  <div id="cartPage" class="hidden">

    <div class="card">
      <h2>🛒 Сабади шумо</h2>

      <div id="cartItems"></div>

      <button class="green" onclick="order()">
        Фармоиш додан 📦
      </button>

      <button onclick="showPage('home')">
        ← Бозгашт
      </button>
    </div>

  </div>


  <!-- ADMIN LOGIN -->
  <div id="loginPage" class="hidden">

    <div class="card">

      <div class="admin-title">
        👨‍💼 Admin
      </div>

      <p class="small">
        Барои ворид шудан паролро навис.
      </p>

      <input
        type="password"
        id="adminPassword"
        placeholder="Парол"
      >

      <button onclick="loginAdmin()">
        Даромадан
      </button>

      <button onclick="showPage('home')">
        ← Бозгашт
      </button>

    </div>

  </div>


  <!-- ADMIN PANEL -->
  <div id="adminPage" class="hidden">

    <div class="card">

      <div class="admin-title">
        👨‍💼 Панели Admin
      </div>

      <p class="small">
        Дар ин ҷо маҳсулотро идора карда метавонӣ.
      </p>

      <input
        id="productName"
        placeholder="Номи маҳсулот"
      >

      <input
        id="productPrice"
        type="number"
        placeholder="Нарх (сомонӣ)"
      >

      <button class="green" onclick="addProductAdmin()">
        ➕ Илова кардани маҳсулот
      </button>

    </div>

    <div id="adminProducts"></div>

    <div class="card">
      <button class="red" onclick="logoutAdmin()">
        Баромадан аз Admin
      </button>
    </div>

  </div>

</div>


<!-- BOTTOM MENU -->
<div class="bottom">

  <button onclick="showPage('home')">
    🏠<br>Асосӣ
  </button>

  <button onclick="showPage('cart')">
    🛒<br>Сабад
  </button>

  <button onclick="openAdmin()">
    👨‍💼<br>Admin
  </button>

</div>


<script>

let cart = JSON.parse(
  localStorage.getItem("cart") || "[]"
);

let products = JSON.parse(
  localStorage.getItem("products") || "null"
);


/* МАҲСУЛОТИ АВВАЛИЯ */

if(!products){

  products = [
    {
      id:1,
      name:"Шакар 1 кг",
      price:9.80
    },
    {
      id:2,
      name:"Snickers 2 дона",
      price:9
    },
    {
      id:3,
      name:"Колбаса",
      price:36.80
    }
  ];

  saveProducts();
}


/* НИШОН ДОДАНИ МАҲСУЛОТ */

function renderProducts(){

  let html="";

  products.forEach(function(product){

    html += `
      <div class="card">

        <div class="product">

          <div class="product-info">

            <div class="product-name">
              ${product.name}
            </div>

            <div class="price">
              ${product.price} сомонӣ
            </div>

          </div>

        </div>

        <button
          class="green"
          onclick="addToCart(${product.id})"
        >
          🛒 Ба сабад
        </button>

      </div>
    `;

  });

  document.getElementById("products").innerHTML =
    html || '<div class="empty">Маҳсулот нест.</div>';
}


/* САБАД */

function addToCart(id){

  let product = products.find(
    p => p.id === id
  );

  if(!product) return;

  cart.push({
    name:product.name,
    price:product.price
  });

  saveCart();

  alert("Ба сабад илова шуд! 🛒");

  updateCartCount();
}


function updateCartCount(){

  document.getElementById("cartCount").innerText =
    cart.length;
}


function saveCart(){

  localStorage.setItem(
    "cart",
    JSON.stringify(cart)
  );

}
